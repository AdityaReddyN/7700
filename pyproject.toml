[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adsb-analyst"
version = "0.0.1"
description = "AI incident analyst for ADS-B aircraft-tracking anomalies (Meta Global AI Developer Hackathon 2026)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya" }]

# Pinned to the versions verified on the laptop (see docs/PROGRESS_LOG.md M0).
dependencies = [
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.3",
    "pandas==2.3.3",
    "pyarrow==23.0.1",
    "duckdb==1.1.3",
    "rank-bm25==0.2.2",
    "openai==1.59.6",
    "psutil==6.1.1",
    "scikit-learn==1.8.0",
    "matplotlib==3.10.8",
    "plotly==6.7.0",
    "streamlit==1.55.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Dev prompts are prose data; wrapping each sentence hurts readability.
"src/agents/prompts/dev_prompts.py" = ["E501"]
